name: Keepalive

# GitHub disables scheduled workflows in public repositories after 60 days of
# repository inactivity. A monthly commit keeps the 5-minute watcher enabled.

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Commit a timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: keep scheduled workflows active"
            git push
          fi
